name: Maine IE Tracker

on:
  schedule:
    - cron: "0 * * * *"     # every hour
  workflow_dispatch:         # manual run button

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Run the tracker
        run: python ie_tracker.py

      - name: Open an issue if a watched race has new spending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f alert.txt ]; then
            gh issue create \
              --title "New IE in watched race ($(date -u +%Y-%m-%d))" \
              --body-file alert.txt
            rm alert.txt
          fi

      - name: Save the updated CSV back to the repository
        run: |
          git config user.name "ie-tracker-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update IE data $(date -u +%Y-%m-%d)"
          git diff --quiet HEAD origin/main 2>/dev/null || git push
