name: Maine IE Tracker

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (7 AM Eastern)
  workflow_dispatch:        # also lets you run it manually with a button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Run the tracker
        run: python ie_tracker.py

      - name: Save the updated CSV back to the repository
        run: |
          git config user.name "ie-tracker-bot"
          git config user.email "actions@github.com"
          git add ie_tracker.csv
          git diff --cached --quiet || git commit -m "Update IE data $(date -u +%Y-%m-%d)"
          git push
